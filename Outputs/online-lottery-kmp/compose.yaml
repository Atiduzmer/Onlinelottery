name: online-lottery-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: online_lottery
      POSTGRES_USER: online_lottery
      POSTGRES_PASSWORD: online_lottery_dev
    ports:
      - "5432:5432"
    volumes:
      - online_lottery_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_lottery -d online_lottery"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - online_lottery_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  online_lottery_postgres:
  online_lottery_redis:
