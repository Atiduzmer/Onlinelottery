spring:
  application:
    name: online-lottery-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/online_lottery}
    username: ${DB_USER:online_lottery}
    password: ${DB_PASSWORD:online_lottery_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Online Lottery Server
    version: 0.1.0
